name = "smapworks-gallery"
main = "_worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[assets]
directory = "../../dist"
binding = "ASSETS"
# SPA fallback: any path with no matching static asset gets index.html.
not_found_handling = "single-page-application"

