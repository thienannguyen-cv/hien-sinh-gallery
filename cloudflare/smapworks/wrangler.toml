name = "smapworks-gallery"
main = "_worker.js"
compatibility_date = "2024-09-23"

[assets]
directory = "../../dist"
# SPA fallback: any path with no matching static asset gets index.html.
# This makes cold direct navigation to /gallery work without a server rewrite rule.
not_found_handling = "single-page-application"

[[routes]]
pattern = "smapworks.art/*"
zone_name = "smapworks.art"
