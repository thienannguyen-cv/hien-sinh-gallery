name = "smapworks-gallery"
main = "_worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[assets]
directory = "../../dist"
binding = "ASSETS"
# SPA fallback: any path with no matching static asset gets index.html.
not_found_handling = "single-page-application"

# [[routes]]
# G3d reconciliation: the apex Custom Domain is managed in Cloudflare's dashboard, not by a Workers Route.
# Keep this route block disabled; an explicit API-forwarding Worker change needs separate Owner authorization.
# pattern = "smapworks.art/*"
# zone_name = "smapworks.art"
