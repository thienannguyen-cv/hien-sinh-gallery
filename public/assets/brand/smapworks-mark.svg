<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="SMap logo mark">
  <!-- SMap mark — "S-route": a point's journey through the 3x3 routing neighborhood.
       hollow ring = vacated origin cell (husk) · white S path = routing / identity transport
       amber dot = active point landing · amber cell = target covered (Phi -> 0) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38618D"/>
      <stop offset="1" stop-color="#1D3E63"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <!-- 3x3 routing neighborhood -->
  <g fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.16)" stroke-width="2.5">
    <rect x="108" y="108" width="88" height="88" rx="16"/>
    <rect x="212" y="108" width="88" height="88" rx="16"/>
    <rect x="316" y="108" width="88" height="88" rx="16"/>
    <rect x="108" y="212" width="88" height="88" rx="16"/>
    <rect x="212" y="212" width="88" height="88" rx="16"/>
    <rect x="316" y="212" width="88" height="88" rx="16"/>
    <rect x="212" y="316" width="88" height="88" rx="16"/>
    <rect x="316" y="316" width="88" height="88" rx="16"/>
  </g>
  <!-- target cell (covered) -->
  <rect x="108" y="316" width="88" height="88" rx="16" fill="rgba(251,191,36,0.14)" stroke="rgba(251,191,36,0.6)" stroke-width="3"/>
  <!-- landing glow (under the route so the white stroke stays crisp) -->
  <circle cx="152" cy="360" r="40" fill="#FBBF24" opacity="0.25"/>
  <!-- S route through cell centers -->
  <path d="M360 152 L192 152 Q152 152 152 192 L152 216 Q152 256 192 256 L320 256 Q360 256 360 296 L360 320 Q360 360 320 360 L152 360"
        fill="none" stroke="#FFFFFF" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- origin: vacated (hollow) -->
  <circle cx="360" cy="152" r="21" fill="#2A5078" stroke="#FFFFFF" stroke-width="10"/>
  <!-- the point lands on the target -->
  <circle cx="152" cy="360" r="27" fill="#FBBF24"/>
</svg>
